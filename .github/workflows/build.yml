name: C++ build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y freeglut3-dev libfreeimage-dev

      - name: Build
        run: make

      - name: Check whitespace
        run: git diff --check
